[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lamat-quant"
version = "0.1.0"
description = "Reusable research tools for Lamat's quantitative finance examples"
requires-python = ">=3.9"

[project.optional-dependencies]
regimes = ["numpy>=1.24,<3", "scikit-learn>=1.3,<1.7", "matplotlib>=3.7,<3.10"]

[tool.setuptools.packages.find]
where = ["src"]
