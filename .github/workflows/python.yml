name: Python research checks

on:
  push:
  pull_request:

jobs:
  research:
    # Ubuntu 26.04 does not provide a Python 3.9 build to setup-python.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=packages/quant-research/src python -m unittest discover -s packages/quant-research/tests
      - name: Run offline example
        run: PYTHONPATH=packages/quant-research/src python examples/mean_reversion.py
      - name: Check archive can be regenerated
        run: |
          python scripts/build_archive.py
          git diff --exit-code -- apps/web/archive.html
